[project]
name = "self-evaluating-rag"
version = "0.1.0"
description = "A YouTube chatbot that answers from video transcripts, with an automated eval suite for the retriever and generator."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv",
    "faiss-cpu",
    "langchain-core>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-openai>=1.7.3",
    "youtube-transcript-api>=1.2.5",
    "deepeval",
    "portalocker[win32]>=4.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
