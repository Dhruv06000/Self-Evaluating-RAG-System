[project]
name = "self-evaluating-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "tqdm",
    "torch",
    "faiss-cpu",
    "sentence-transformers",
    "transformers",
    "python-dotenv",
    "deepeval",
    "portalocker[win32]>=4.4.0",
    "openai>=3.29.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "unstructured>=0.27.34",
    "python-docx>=1.2.0",
    "langchain-core>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-openai>=1.7.3",
    "youtube-transcript-api>=1.2.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
pythonpath = ["."]
